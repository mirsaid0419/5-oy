version: '3.9'

services:
  db-docker:
  image: postgresql:15
  container_name: 26_postgres
  restart: always
  environment:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: 1234
    POSTGRES_DB: docker_compose

  ports:
    - "5433:5432"
  volumes:
    - baza_data:/var/lib/postgresql/data

  redis:

    image: redis:7
    container_name: 26_redis
    restart: always
    ports:
      -"6379:6379"
  app:
    build: .
    container_name: 26_app
    restart: always
    env_file:
      - .env
    ports:
      - "4000:3000"
    depends_on:
      - db-docker
      - redis
    environment:
      DATABASE_URL: postgres://postgres:1234@db-docker:5432/docker_compose?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
volumes:
  baza_data
